name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # write: the screenshot step pushes PNGs to a ci-shots/* branch
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: Build and test (Windows x64, MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-cargo-${{ hashFiles('**/Cargo.toml') }}-
            windows-cargo-

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --release 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          cargo build --workspace --release 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Smoke-test the tools on generated data
        id: smoke
        shell: pwsh
        run: |
          .\target\release\dupemap-gen.exe --out "$env:RUNNER_TEMP\gen" --rows 200000
          .\target\release\dupemap-check.exe "$env:RUNNER_TEMP\gen" --top 3 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\check.txt"
          # the generated manifests contain deliberate bad lines, so alerts (exit code 1) are expected
          if ($LASTEXITCODE -ne 1) { throw "dupemap-check: expected exit code 1 (alerts), got $LASTEXITCODE" }
          .\target\release\dupemap-check.exe "$env:RUNNER_TEMP\gen\manifest-*.tsv" --top 1 | Select-Object -First 3
          # the built-in scan: the drives it sees, then a folder hashed into a manifest that imports
          .\target\release\dupemap-scan.exe --list
          if ($LASTEXITCODE -ne 0) { throw "dupemap-scan --list failed with $LASTEXITCODE" }
          $scan = "$env:RUNNER_TEMP\scanme"
          New-Item -ItemType Directory -Force -Path "$scan\sub dir" | Out-Null
          [IO.File]::WriteAllBytes("$scan\a.bin", (New-Object byte[] 200000))
          [IO.File]::WriteAllBytes("$scan\sub dir\copy of a.bin", (New-Object byte[] 200000))
          .\target\release\dupemap-scan.exe --folder $scan --host "CI test" --out "$env:RUNNER_TEMP\scans" --min-size 1000
          if ($LASTEXITCODE -ne 0) { throw "dupemap-scan failed with $LASTEXITCODE" }
          .\target\release\dupemap-check.exe "$env:RUNNER_TEMP\scans" --top 1
          if ($LASTEXITCODE -ne 0) { throw "the scanned manifest did not import cleanly ($LASTEXITCODE)" }
          .\target\release\dupemap-bench.exe --rows 1000000 --work "$env:RUNNER_TEMP\bench" | Out-File -Encoding utf8 "$env:RUNNER_TEMP\bench.md"
          if ($LASTEXITCODE -ne 0) { throw "dupemap-bench failed with $LASTEXITCODE" }
          Get-Content "$env:RUNNER_TEMP\bench.md"

      - name: Run the app and take screenshots
        id: shots
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The runner has no GPU, so give the app Mesa's software OpenGL (llvmpipe) next to a copy
          # of the exe. The released DupeMap.exe uses the system's OpenGL driver.
          $t = "$env:RUNNER_TEMP\appshot"
          New-Item -ItemType Directory -Force -Path "$t\shots" | Out-Null
          gh release download --repo pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" --dir "$t" --clobber
          $archive = Get-ChildItem "$t\mesa3d-*-release-msvc.7z" | Select-Object -First 1
          if (-not $archive) { throw "Mesa download failed" }
          7z x $archive.FullName "-o$t\mesa" -y | Out-Null
          Copy-Item "$t\mesa\x64\*.dll" "$t\"
          Copy-Item ".\target\release\DupeMap.exe" "$t\"
          $p = Start-Process -FilePath "$t\DupeMap.exe" -ArgumentList @("--db", "$t\shot.db", "--demo", "300000", "--screenshot", "$t\shots\dupemap.png") -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "DupeMap did not finish its screenshots within 4 minutes" }
          Get-ChildItem "$t\shots" | Format-Table Name, Length
          if (-not (Test-Path "$t\shots\dupemap.png")) { throw "no screenshot written (exit code $($p.ExitCode))" }

      - name: Compress and publish screenshots
        if: steps.shots.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Add-Type -AssemblyName System.Drawing
          $dir = "$env:RUNNER_TEMP\appshot\shots"
          $out = "$env:RUNNER_TEMP\shots-branch"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem "$dir\*.png" | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $img.Save("$out\$($_.Name)", [System.Drawing.Imaging.ImageFormat]::Png)
            $img.Dispose()
          }
          Set-Location $out
          git init -q
          git checkout -q -b shots
          git add *.png
          git -c user.name="ci" -c user.email="ci@localhost" commit -q -m "screenshots of ${{ github.event.pull_request.head.sha }}"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" "shots:refs/heads/ci-shots/pr-${{ github.event.pull_request.number }}"

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v7
        with:
          name: dupemap-windows-x64
          path: |
            target/release/DupeMap.exe
            target/release/dupemap-gen.exe
            target/release/dupemap-check.exe
            target/release/dupemap-bench.exe
            target/release/dupemap-scan.exe
          if-no-files-found: error
          retention-days: 30

      - name: Report on the pull request
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S="$RUNNER_TEMP/summary.md"
          T="$RUNNER_TEMP/test.log"
          passed=$(grep -ho 'test result: [a-zA-Z]*\. [0-9]* passed' "$T" 2>/dev/null | awk '{s+=$4} END {print s+0}')
          failed=$(grep -ho '; [0-9]* failed' "$T" 2>/dev/null | awk '{s+=$2} END {print s+0}')
          {
            echo "### Windows build: ${{ job.status }}"
            echo
            echo "- Commit: ${{ github.event.pull_request.head.sha }}"
            echo "- Toolchain: $(rustc --version 2>/dev/null)"
            echo "- Steps: test **${{ steps.test.outcome }}**, build **${{ steps.build.outcome }}**, smoke test **${{ steps.smoke.outcome }}**, app screenshots **${{ steps.shots.outcome }}**"
            echo "- Screenshots: branch \`ci-shots/pr-${{ github.event.pull_request.number }}\`"
            echo "- Tests: $passed passed, $failed failed"
            if [ -f "$RUNNER_TEMP/bench.md" ]; then
              echo
              echo "<details><summary>Benchmark, 1M generated rows</summary>"
              echo
              tr -d '\r' < "$RUNNER_TEMP/bench.md" | sed 's/^\xEF\xBB\xBF//'
              echo
              echo "</details>"
            fi
            for f in test build; do
              if [ "$f" = test ] && [ "${{ steps.test.outcome }}" != "failure" ]; then continue; fi
              if [ "$f" = build ] && [ "${{ steps.build.outcome }}" != "failure" ]; then continue; fi
              echo
              echo "<details open><summary>$f log (last 120 lines)</summary>"
              echo
              echo '```'
              tail -n 120 "$RUNNER_TEMP/$f.log" 2>/dev/null
              echo '```'
              echo "</details>"
            done
          } > "$S"
          cat "$S" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file "$S" --edit-last --create-if-none \
            || gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file "$S"
