name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: Build and test (Windows x64, MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-cargo-${{ hashFiles('**/Cargo.toml') }}-
            windows-cargo-

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --release 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          cargo build --workspace --release 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Smoke-test the tools on generated data
        id: smoke
        shell: pwsh
        run: |
          .\target\release\dupemap-gen.exe --out "$env:RUNNER_TEMP\gen" --rows 200000
          .\target\release\dupemap-check.exe "$env:RUNNER_TEMP\gen" --top 3 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\check.txt"
          # the generated manifests contain deliberate bad lines, so alerts (exit code 1) are expected
          if ($LASTEXITCODE -ne 1) { throw "dupemap-check: expected exit code 1 (alerts), got $LASTEXITCODE" }
          .\target\release\dupemap-check.exe "$env:RUNNER_TEMP\gen\manifest-*.tsv" --top 1 | Select-Object -First 3
          .\target\release\dupemap-bench.exe --rows 1000000 --work "$env:RUNNER_TEMP\bench" | Out-File -Encoding utf8 "$env:RUNNER_TEMP\bench.md"
          if ($LASTEXITCODE -ne 0) { throw "dupemap-bench failed with $LASTEXITCODE" }
          Get-Content "$env:RUNNER_TEMP\bench.md"

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v7
        with:
          name: dupemap-windows-x64
          path: |
            target/release/dupemap-gen.exe
            target/release/dupemap-check.exe
            target/release/dupemap-bench.exe
          if-no-files-found: error
          retention-days: 30

      - name: Report on the pull request
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S="$RUNNER_TEMP/summary.md"
          T="$RUNNER_TEMP/test.log"
          passed=$(grep -ho 'test result: [a-zA-Z]*\. [0-9]* passed' "$T" 2>/dev/null | awk '{s+=$4} END {print s+0}')
          failed=$(grep -ho '; [0-9]* failed' "$T" 2>/dev/null | awk '{s+=$2} END {print s+0}')
          {
            echo "### Windows build: ${{ job.status }}"
            echo
            echo "- Commit: ${{ github.event.pull_request.head.sha }}"
            echo "- Toolchain: $(rustc --version 2>/dev/null)"
            echo "- Steps: test **${{ steps.test.outcome }}**, build **${{ steps.build.outcome }}**, smoke test **${{ steps.smoke.outcome }}**"
            echo "- Tests: $passed passed, $failed failed"
            if [ -f "$RUNNER_TEMP/bench.md" ]; then
              echo
              echo "<details><summary>Benchmark, 1M generated rows</summary>"
              echo
              tr -d '\r' < "$RUNNER_TEMP/bench.md" | sed 's/^\xEF\xBB\xBF//'
              echo
              echo "</details>"
            fi
            for f in test build; do
              if [ "$f" = test ] && [ "${{ steps.test.outcome }}" != "failure" ]; then continue; fi
              if [ "$f" = build ] && [ "${{ steps.build.outcome }}" != "failure" ]; then continue; fi
              echo
              echo "<details open><summary>$f log (last 120 lines)</summary>"
              echo
              echo '```'
              tail -n 120 "$RUNNER_TEMP/$f.log" 2>/dev/null
              echo '```'
              echo "</details>"
            done
          } > "$S"
          cat "$S" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file "$S" --edit-last --create-if-none \
            || gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file "$S"
