[package]
name = "dupemap-core"
description = "Manifest import, duplicate index and queries for DupeMap"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
