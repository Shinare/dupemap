[package]
name = "dupemap-app"
description = "DupeMap desktop app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "DupeMap"
path = "src/main.rs"

[dependencies]
dupemap-core = { path = "../core" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = { version = "0.36", default-features = false }
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
